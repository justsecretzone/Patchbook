<title>Website Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Patchbook: the work fills the stage, patches live in a glass panel that opens from the side. */
:root {
  --bg: #eceae3;
  --panel: #fdfcf9;
  --stage: #e9e7df;
  --ink: #1f1e1c;
  --muted: #74716a;
  --faint: #a8a59c;
  --line: rgba(31, 30, 28, .09);
  --line-strong: rgba(31, 30, 28, .17);
  --accent: #1f1e1c;
  --accent-soft: rgba(31, 30, 28, .07);
  --on-accent: #ffffff;
  --ok: #2f9e5b;
  --ok-soft: rgba(47, 158, 91, .12);
  --work: #74716a;
  --done-pin: #8d8a82;
  --ring: rgba(31, 30, 28, .32);
  --ring-soft: rgba(31, 30, 28, .06);
  --shadow: 0 1px 2px rgba(31, 30, 28, .06), 0 6px 20px rgba(31, 30, 28, .06);
  /* liquid glass */
  --glass: rgba(255, 255, 255, .56);
  --glass-2: rgba(255, 255, 255, .78);
  --glass-solid: rgba(250, 249, 245, .9);
  --glass-edge: rgba(255, 255, 255, .9);
  --glass-line: rgba(31, 30, 28, .08);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(31, 30, 28, .03);
  --glass-drop: 0 10px 32px rgba(31, 30, 28, .13), 0 1px 3px rgba(31, 30, 28, .08);
  --field: rgba(255, 255, 255, .72);
  --amb-1: rgba(255, 255, 255, .85);
  --amb-2: rgba(255, 255, 255, .5);
  --scrim: rgba(31, 30, 28, .22);
  --blur: blur(22px) saturate(180%);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1918; --panel: #262523; --stage: #141312; --ink: #f2f0ea; --muted: #a6a39b; --faint: #75726b;
    --line: rgba(242, 240, 234, .09); --line-strong: rgba(242, 240, 234, .16);
    --accent: #ffffff; --accent-soft: rgba(255, 255, 255, .1); --on-accent: #1c1b19;
    --ok: #46c27a; --ok-soft: rgba(70, 194, 122, .15); --work: #a6a39b; --done-pin: #6f6c66; --ring: rgba(255, 255, 255, .3); --ring-soft: rgba(255, 255, 255, .05);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --glass: rgba(58, 57, 53, .5); --glass-2: rgba(66, 65, 61, .72); --glass-solid: rgba(38, 37, 35, .9);
    --glass-edge: rgba(255, 255, 255, .1); --glass-line: rgba(255, 255, 255, .09);
    --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .2);
    --glass-drop: 0 12px 36px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3);
    --field: rgba(255, 255, 255, .07); --amb-1: rgba(255, 255, 255, .06); --amb-2: rgba(255, 255, 255, .03); --scrim: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1918; --panel: #262523; --stage: #141312; --ink: #f2f0ea; --muted: #a6a39b; --faint: #75726b;
  --line: rgba(242, 240, 234, .09); --line-strong: rgba(242, 240, 234, .16);
  --accent: #ffffff; --accent-soft: rgba(255, 255, 255, .1); --on-accent: #1c1b19;
  --ok: #46c27a; --ok-soft: rgba(70, 194, 122, .15); --work: #a6a39b; --done-pin: #6f6c66; --ring: rgba(255, 255, 255, .3); --ring-soft: rgba(255, 255, 255, .05);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --glass: rgba(58, 57, 53, .5); --glass-2: rgba(66, 65, 61, .72); --glass-solid: rgba(38, 37, 35, .9);
  --glass-edge: rgba(255, 255, 255, .1); --glass-line: rgba(255, 255, 255, .09);
  --glass-hi: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .2);
  --glass-drop: 0 12px 36px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3);
  --field: rgba(255, 255, 255, .07); --amb-1: rgba(255, 255, 255, .06); --amb-2: rgba(255, 255, 255, .03); --scrim: rgba(0, 0, 0, .45);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
/* no page zoom: fields use 16px on touch (below), double-tap and pinch never scale the whole review */
html, body { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(120% 80% at 100% 0%, var(--amb-1), transparent 60%),
    radial-gradient(90% 70% at 0% 100%, var(--amb-2), transparent 55%),
    var(--bg);
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
textarea:focus-visible, [contenteditable]:focus-visible { outline: none; }

#pb-app {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; transition: grid-template-columns .24s var(--ease);
  padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
.pb-stage {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--stage); overflow: hidden;
}
#pb-app.collapsed { grid-template-columns: minmax(0, 1fr) 52px; }
@media (prefers-reduced-motion: reduce) { #pb-app, .pb-drawer, .pb-scrim, .pb-fab, .tl { transition: none !important; } }

/* ---------- toolbar ---------- */
.pb-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 10px; border-bottom: 1px solid var(--glass-line);
  background: linear-gradient(180deg, var(--glass-2), var(--glass)); box-shadow: var(--glass-hi);
  position: relative; z-index: 3;
}
.pb-bar .pb-grow { flex: 1; }
.pb-seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--line); gap: 2px; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .05); }
.pb-seg button {
  border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap;
  transition: color .15s, background .2s var(--ease);
}
.pb-seg button[aria-pressed="true"] { background: var(--glass-2); color: var(--ink); box-shadow: var(--glass-hi), 0 1px 4px rgba(0, 0, 0, .12); }
.pb-seg button:hover { color: var(--ink); }
.pb-seg svg { width: 15px; height: 15px; }
.pb-btn {
  border: 1px solid var(--glass-line); background: var(--field); border-radius: 999px; padding: 5px 11px; box-shadow: var(--glass-hi);
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--ink);
}
.pb-btn:hover { border-color: var(--line-strong); }
.pb-btn svg, .pb-ibtn svg { width: 16px; height: 16px; }
.pb-ibtn {
  border: 0; background: transparent; border-radius: 50%; width: 30px; height: 30px; padding: 0;
  display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); transition: background .15s, color .15s;
}
.pb-ibtn:hover { background: var(--line); color: var(--ink); }
.pb-ibtn:disabled { opacity: .35; cursor: default; background: none; }
.pb-select {
  border: 1px solid var(--glass-line); background: var(--field); color: var(--ink); border-radius: 999px; box-shadow: var(--glass-hi);
  padding: 5px 10px; font: inherit; font-size: 13px; max-width: 220px;
}
.pb-chip-ver {
  font: 500 11px/1 var(--mono); letter-spacing: .02em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; background: var(--field);
}
.pb-num { font-variant-numeric: tabular-nums; }
.pb-kbd { font: 11px var(--mono); color: var(--faint); }

/* ---------- pins ---------- */
.pb-pin {
  position: absolute; width: 26px; height: 26px; box-sizing: border-box;
  transform-origin: 0 0; transform: scale(var(--iz, 1)) translateY(-100%);
  border-radius: 50% 50% 50% 0; background: var(--accent); color: var(--on-accent);
  font: 600 11px/26px var(--font); text-align: center; cursor: pointer; pointer-events: auto;
  box-shadow: 0 0 0 2px var(--panel), 0 3px 8px rgba(0, 0, 0, .28); user-select: none; z-index: 2; touch-action: none;
}
.pb-pin:not(.done) { cursor: grab; }
.pb-pin.dragging { cursor: grabbing; z-index: 5; box-shadow: 0 0 0 2px var(--panel), 0 10px 22px rgba(0, 0, 0, .35); }
.pb-pin.working { background: var(--work); }
.pb-pin.done { background: var(--ok); color: #fff; }
.pb-pin.done svg, .pb-badge svg { width: 62%; height: 62%; display: block; margin: auto; }
.pb-pin.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent), 0 3px 8px rgba(0, 0, 0, .28); z-index: 3; }
.pb-pin.draft { background: var(--panel); color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 3px 8px rgba(0, 0, 0, .25); animation: pb-pulse 1.4s ease-in-out infinite; }
.pb-region {
  position: absolute; border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 3px;
  pointer-events: none; box-sizing: border-box;
}
.pb-region.done { border-color: var(--done-pin); background: transparent; border-style: dashed; }
.pb-region.draft { border-style: dashed; }
@keyframes pb-pulse { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 7px var(--accent-soft), 0 3px 8px rgba(0, 0, 0, .25); } }
@media (prefers-reduced-motion: reduce) { .pb-pin.draft { animation: none; } }

/* ---------- patches panel ---------- */
#pb-side {
  min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative;
  background: linear-gradient(180deg, var(--glass-2), var(--glass));
  border-left: 1px solid var(--glass-line); box-shadow: inset 1px 0 0 var(--glass-edge); overflow: hidden;
}
.pb-drawer { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pb-rail, .pb-open, .pb-scrim { display: none; }
.pb-toggle { flex: none; margin-left: -2px; }
.pb-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--glass-line); }
.pb-title { font: 650 16px/1.2 var(--font); letter-spacing: -.015em; flex: 1; display: flex; align-items: center; gap: 8px; }
.pb-seg .pb-count { font: 500 11px var(--mono); color: var(--faint); }
.pb-seg button[aria-pressed="true"] .pb-count { color: var(--accent); }
.pb-list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.pb-empty { margin: auto; padding: 28px 22px; text-align: center; color: var(--muted); font-size: 13px; max-width: 30ch; text-wrap: balance; }
.pb-empty svg { width: 22px; height: 22px; color: var(--faint); display: block; margin: 0 auto 10px; }

@media (min-width: 861px) {
  #pb-app.collapsed #pb-side > :not(.pb-rail) { display: none; }
  #pb-app.collapsed .pb-rail {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; border: 0; background: none;
    width: 100%; height: 100%; cursor: pointer; color: var(--muted);
  }
  #pb-app.collapsed .pb-rail:hover { color: var(--ink); }
  .pb-rail-count {
    min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; box-sizing: border-box; background: var(--accent); color: var(--on-accent);
    font: 600 11px/22px var(--font); text-align: center;
  }
}

/* Phones: the work goes edge to edge, the input docks below it, patches slide in from the right. */
@media (max-width: 860px) {
  #pb-app, #pb-app.collapsed { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  #pb-side { background: none; border: 0; box-shadow: none; overflow: visible; }
  .pb-drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(88vw, 380px); box-sizing: border-box;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) 0;
    background: var(--glass-2); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border-left: 1px solid var(--glass-edge); border-radius: 26px 0 0 26px;
    box-shadow: var(--glass-hi), -18px 0 50px rgba(0, 0, 0, .18);
    transform: translate3d(0, 0, 0); transition: transform .34s var(--ease), visibility 0s;
  }
  #pb-app.collapsed .pb-drawer { transform: translate3d(106%, 0, 0); visibility: hidden; transition: transform .28s var(--ease), visibility 0s .28s; }
  .pb-scrim {
    display: block; position: fixed; inset: 0; z-index: 55; background: var(--scrim); opacity: 1; transition: opacity .28s ease, visibility 0s;
  }
  #pb-app.collapsed .pb-scrim { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .28s ease, visibility 0s .28s; }
  .pb-head { padding: 14px 10px 10px 18px; }
  .pb-title { font-size: 17px; }
  .pb-open {
    display: grid; place-items: center; position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 1px solid var(--glass-line); background: var(--field); color: var(--ink); box-shadow: var(--glass-hi), 0 2px 10px rgba(0, 0, 0, .06);
  }
  .pb-open svg { width: 19px; height: 19px; }
  .pb-open-count {
    position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; box-sizing: border-box;
    background: var(--accent); color: var(--on-accent); font: 600 10.5px/18px var(--font); text-align: center; box-shadow: 0 0 0 2px var(--panel);
  }
  .pb-foot {
    border-top: 1px solid var(--glass-line); background: linear-gradient(180deg, var(--glass-2), var(--glass)); box-shadow: var(--glass-hi);
    padding: 8px 10px max(8px, calc(env(safe-area-inset-bottom, 0px) - 8px));
  }
  .pb-note:not(.ro) { display: none; }
  .pb-handoff { padding-bottom: 12px; }
  .pb-fab { bottom: 10px; }
  .pb-bar { padding: 4px 6px; gap: 6px; min-height: 0; }
  .pb-bar .pb-seg button { padding: 4px 8px; }
}

.pb-item {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 10px 8px 10px 10px; border-radius: 14px; cursor: pointer; position: relative; transition: background .15s;
}
.pb-item:hover { background: var(--line); }
.pb-item.sel { background: var(--field); box-shadow: var(--glass-hi), 0 1px 6px rgba(0, 0, 0, .06); }
.pb-badge {
  width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: var(--accent); color: var(--on-accent);
  font: 600 10.5px/22px var(--font); text-align: center; margin-top: 1px;
}
.pb-item.working .pb-badge { background: var(--work); }
.pb-item.done .pb-badge { background: var(--ok); color: #fff; display: grid; place-items: center; }
.pb-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.pb-where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pb-who { width: 16px; height: 16px; border-radius: 50%; flex: none; font: 600 9px/16px var(--font); text-align: center; color: #fff; }
.pb-text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pb-item.done .pb-text { color: var(--muted); }
.pb-text[contenteditable="true"] { box-shadow: 0 0 0 1px var(--line-strong); border-radius: 8px; padding: 2px 5px; margin-left: -5px; cursor: text; background: var(--field); }
.pb-shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pb-shots img {
  width: 54px; height: 40px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; cursor: zoom-in; background: var(--stage);
}
.pb-reply {
  margin-top: 8px; padding: 7px 10px; border-radius: 12px; background: var(--line); font-size: 12.5px;
  display: flex; gap: 7px; align-items: flex-start;
}
.pb-state { margin-top: 6px; font-size: 11.5px; color: var(--work); display: inline-flex; align-items: center; gap: 6px; }
.pb-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pb-blink 1.2s ease-in-out infinite; }
@keyframes pb-blink { 50% { opacity: .25; } }
.pb-acts { display: flex; gap: 0; opacity: 0; transition: opacity .12s; }
.pb-item:hover .pb-acts, .pb-item.sel .pb-acts, .pb-item:focus-within .pb-acts { opacity: 1; }
@media (hover: none) { .pb-acts { opacity: 1; } }
.pb-acts .pb-ibtn { width: 28px; height: 28px; }
.pb-acts .pb-ok:hover { color: var(--ok); background: var(--ok-soft); }
.pb-acts .pb-del.armed { color: #fff; background: #b4483a; }

.pb-foot { border-top: 1px solid var(--glass-line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pb-frow { display: flex; align-items: flex-end; gap: 8px; }
.pb-compose {
  flex: 1; min-width: 0; border: 1px solid var(--glass-line); border-radius: 22px; background: var(--field);
  box-shadow: var(--glass-hi), 0 2px 12px rgba(0, 0, 0, .05);
  padding: 6px 6px 6px 14px; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, box-shadow .15s;
}
.pb-compose:focus-within { border-color: var(--line-strong); box-shadow: var(--glass-hi), 0 4px 18px rgba(0, 0, 0, .09); }
.pb-compose.drag { border-style: dashed; }
.pb-ctx { display: flex; align-items: center; gap: 6px; min-width: 0; height: 18px; margin-top: 3px; padding-right: 4px; font-size: 12px; color: var(--muted); }
.pb-ctx.general { color: var(--faint); }
.pb-ctx-ico { width: 12px; height: 12px; flex: none; display: grid; place-items: center; }
.pb-ctx-ico svg { width: 12px; height: 12px; }
.pb-ctx-text { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pb-ctx-x {
  margin-left: auto; flex: none; width: 20px; height: 20px; border: 0; padding: 0; border-radius: 50%; background: none;
  color: var(--faint); display: grid; place-items: center; cursor: pointer;
}
.pb-ctx-x:hover { color: var(--ink); background: var(--line); }
.pb-ctx-x svg { width: 11px; height: 11px; }
.pb-dshots { display: flex; gap: 8px; flex-wrap: wrap; }
.pb-dshot { position: relative; width: 52px; height: 52px; flex: none; }
.pb-dshot img { width: 100%; height: 100%; object-fit: cover; border-radius: 11px; border: 1px solid var(--line); display: block; cursor: zoom-in; background: var(--stage); }
.pb-dshot.pending img { opacity: .4; }
.pb-dshot button {
  position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; border: 0; padding: 0;
  background: rgba(20, 20, 19, .72); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .12s;
}
.pb-dshot:hover button, .pb-dshot button:focus-visible { opacity: 1; }
@media (hover: none) { .pb-dshot button { opacity: 1; } }
.pb-dshot button svg { width: 10px; height: 10px; }
.pb-ta {
  flex: 1; min-width: 0; display: block; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
  font: inherit; font-size: 14px; line-height: 20px; height: 20px; min-height: 20px; max-height: 160px; padding: 5px 4px 5px 0; margin: 0; box-sizing: content-box;
}
.pb-ta::placeholder { color: var(--faint); }
.pb-crow { display: flex; align-items: flex-end; gap: 1px; }
.pb-crow .pb-ibtn { width: 30px; height: 30px; flex: none; }
.pb-send {
  flex: none; margin-left: 2px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s, transform .15s var(--ease);
}
.pb-send:not(:disabled):active { transform: scale(.92); }
.pb-send:disabled { background: var(--line); color: var(--faint); cursor: default; }
.pb-send svg { width: 15px; height: 15px; }
.pb-handoff { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 8px 14px; border-top: 1px solid var(--glass-line); min-width: 0; }
.pb-handoff > span { white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pb-handoff code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px var(--mono); color: var(--ink); background: var(--line); padding: 3px 7px; border-radius: 999px; letter-spacing: -.01em; }
.pb-handoff .pb-ibtn { flex: none; width: 24px; height: 24px; }
.pb-handoff .pb-ibtn svg { width: 13px; height: 13px; }
.pb-note { font-size: 11.5px; color: var(--faint); padding: 0 4px; }
.pb-copyall { padding: 3px 10px; font-size: 12px; flex: none; white-space: nowrap; }

/* ---------- overlays ---------- */
.pb-dropzone {
  position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 22px; background: var(--glass);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  display: grid; place-items: center; color: var(--accent); font-weight: 600; z-index: 20; pointer-events: none;

      if (d) { const pos = docPos(d), el = PB.pin(0, "draft", false, { left: pos.x + "px", top: pos.y + "px" }); makeDraggable(el, null); pinsBox.append(el); }
      edges(list);
    } else edges([]);
    pointLayer.textContent = "";
    if (pointMode && S.mode === "comment") {
      for (const p of list) { const el = PB.pin(p.n, p.status, S.sel === p.id, { left: p.anchor.x + "px", top: p.anchor.y + "px" }); el.addEventListener("click", () => PB.select(p.id, false)); pointLayer.append(el); }
      if (d) pointLayer.append(PB.pin(0, "draft", false, { left: d.x + "px", top: d.y + "px" }));
    }
  }
  catcher.addEventListener("click", (e) => {
    const r = frame.getBoundingClientRect(), s = r.width / frame.offsetWidth || 1;
    const a = { page: view ? view.src : "", bp: bp.name, vw: frame.offsetWidth, x: Math.round((e.clientX - r.left) / s), y: Math.round((e.clientY - r.top) / s), viewport: true };
    PB.setDraft(a, label(a));
  });
  function edges(list) {
    if (!fwin || (view && view.type !== "page")) { edgeUp.hidden = edgeDown.hidden = true; return; }
    const top = fwin.scrollY, bottom = top + fwin.innerHeight, up = [], down = [];
    for (const p of list) { const y = docPos(p.anchor).y; if (y < top + 8) up.push(y); else if (y - 26 > bottom - 8) down.push(y); }
    const set = (btn, ys, arrow, pick) => {
      btn.hidden = !ys.length; if (!ys.length) return;
      btn.textContent = arrow + " " + ys.length;
      btn.onclick = () => fwin.scrollTo({ top: Math.max(0, pick(ys) - fwin.innerHeight / 3), behavior: "smooth" });
    };
    set(edgeUp, up, "↑", (ys) => Math.max(...ys));
    set(edgeDown, down, "↓", (ys) => Math.min(...ys));
    const fr = frame.getBoundingClientRect(), ar = area.getBoundingClientRect();
    edgeUp.style.top = Math.max(8, fr.top - ar.top + 10) + "px";
    edgeDown.style.bottom = Math.max(0, ar.bottom - fr.bottom) + 72 + "px";
    edgeUp.style.left = edgeDown.style.left = (fr.left - ar.left + fr.width / 2) + "px";
  }
  function setMode(m) {
    catcher.hidden = !(pointMode && m === "comment");
    if (fdoc) {
      if (!fdoc.getElementById("pb-cursor")) { const st = fdoc.createElement("style"); st.id = "pb-cursor"; st.textContent = "html.pb-commenting,html.pb-commenting *{cursor:crosshair!important}"; (fdoc.head || fdoc.documentElement).append(st); }
      fdoc.documentElement.classList.toggle("pb-commenting", m === "comment");
    }
    frame.classList.toggle("commenting", m === "comment");
    if (hl && m !== "comment") { hl.hidden = true; hlTag.hidden = true; }
    canvas.setMode(m); schedule();
  }

  // ---------- jump to a patch ----------
  function focus(p) {
    const a = p.anchor; if (!a) return;
    const go = () => {
      if (a.board || a.frac) { canvas.draw(); return; }
      if (!fwin) return;
      const pos = docPos(a);
      fwin.scrollTo({ top: Math.max(0, pos.y - fwin.innerHeight / 3), behavior: "smooth" });
      schedule();
    };
    if (a.board) { const v = views().find((x) => x.key === "b:" + a.board); if (v && (!view || view.key !== v.key)) return open(v, go); return go(); }
    if (a.frac) { const v = views().find((x) => x.type === "image" && x.src === a.page); if (v && (!view || view.key !== v.key)) return open(v, go); return go(); }
    if (a.bp && a.bp !== bp.name && a.bp !== "Auto") { const b = bps.find((x) => x.name === a.bp); if (b) setBp(b); }
    if (view && view.type === "page" && samePage(pageKey(), a.page)) return go();
    const pg = pages.find((x) => samePage(x.src, a.page));
    if (pg) return open(views().find((x) => x.key === "p:" + pg.src), go);
    if (a.page && !/^https?:/i.test(a.page)) { pendingThen = go; iframe.src = a.page; }
  }

  PB.boot({
    kind: CFG.kind, modes: true, boards: true, fabHost: area,
    scope: (p) => {
      const a = p.anchor; if (!view) return true;
      if (view.type === "board") return a.board === view.id;
      if (view.type === "image") return !!a.frac && a.page === view.src;
      return !a.board && !a.frac && samePage(a.page, pageKey());
    },
    onMode: setMode,
    onChange: schedule,
    onBoards: renderSelect,
    focus,
    onStageDrop: (files) => importBoards(files),
    onPasteImages: (files) => importBoards(files),
  });
  renderSelect();
  open(views()[0]);
  if (CFG.device && !prefersDevice) setBp(bps[0]); else setBp(bp);
})();
</script>

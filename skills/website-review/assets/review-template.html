<title>Website Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Patchbook: stage on the left, patch sidebar on the right; stacks on phones. */
:root {
  --bg: #f5f4ef;
  --panel: #fdfcf9;
  --stage: #ebe9e1;
  --ink: #1f1e1c;
  --muted: #74716a;
  --faint: #a8a59c;
  --line: rgba(31, 30, 28, .1);
  --line-strong: rgba(31, 30, 28, .18);
  --accent: #1f1e1c;
  --accent-soft: rgba(31, 30, 28, .07);
  --on-accent: #ffffff;
  --ok: #4f7d55;
  --ok-soft: rgba(79, 125, 85, .12);
  --work: #74716a;
  --done-pin: #8d8a82;
  --ring: rgba(31, 30, 28, .32);
  --ring-soft: rgba(31, 30, 28, .06);
  --shadow: 0 1px 2px rgba(31, 30, 28, .06), 0 6px 20px rgba(31, 30, 28, .06);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1b19; --panel: #262523; --stage: #151413; --ink: #f2f0ea; --muted: #a6a39b; --faint: #75726b;
    --line: rgba(242, 240, 234, .09); --line-strong: rgba(242, 240, 234, .16);
    --accent: #ffffff; --accent-soft: rgba(255, 255, 255, .1); --on-accent: #1c1b19;
    --ok: #7fae84; --ok-soft: rgba(127, 174, 132, .14); --work: #a6a39b; --done-pin: #6f6c66; --ring: rgba(255, 255, 255, .3); --ring-soft: rgba(255, 255, 255, .05);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1b19; --panel: #262523; --stage: #151413; --ink: #f2f0ea; --muted: #a6a39b; --faint: #75726b;
  --line: rgba(242, 240, 234, .09); --line-strong: rgba(242, 240, 234, .16);
  --accent: #ffffff; --accent-soft: rgba(255, 255, 255, .1); --on-accent: #1c1b19;
  --ok: #7fae84; --ok-soft: rgba(127, 174, 132, .14); --work: #a6a39b; --done-pin: #6f6c66; --ring: rgba(255, 255, 255, .3); --ring-soft: rgba(255, 255, 255, .05);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus, :focus-visible { outline: none; }

#pb-app {
  height: 100%; box-sizing: border-box;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; transition: grid-template-columns .2s ease;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pb-stage {
  position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--stage); border-radius: var(--r); overflow: hidden;
}
#pb-app.collapsed { grid-template-columns: minmax(0, 1fr) 52px; }
@media (max-width: 860px) {
  #pb-app, #pb-app.collapsed { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; padding-block: 8px; }
}
@media (prefers-reduced-motion: reduce) { #pb-app { transition: none; } }

/* ---------- toolbar ---------- */
.pb-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--stage);
  position: relative; z-index: 3;
}
.pb-bar .pb-grow { flex: 1; }
.pb-seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--line); gap: 2px; }
.pb-seg button {
  border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap;
}
.pb-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.pb-seg button:hover { color: var(--ink); }
.pb-seg svg { width: 15px; height: 15px; }
.pb-btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 5px 9px;
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; color: var(--ink);
}
.pb-btn:hover { border-color: var(--line-strong); }
.pb-btn svg, .pb-ibtn svg { width: 16px; height: 16px; }
.pb-ibtn {
  border: 0; background: transparent; border-radius: 8px; width: 30px; height: 30px; padding: 0;
  display: inline-grid; place-items: center; cursor: pointer; color: var(--muted);
}
.pb-ibtn:hover { background: var(--line); color: var(--ink); }
.pb-ibtn:disabled { opacity: .35; cursor: default; background: none; }
.pb-select {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 9px;
  padding: 5px 8px; font: inherit; font-size: 13px; max-width: 220px;
}
.pb-chip-ver {
  font: 500 11px/1 var(--mono); letter-spacing: .02em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; background: var(--panel);
}
.pb-num { font-variant-numeric: tabular-nums; }
.pb-kbd { font: 11px var(--mono); color: var(--faint); }

/* ---------- pins ---------- */
.pb-pin {
  position: absolute; width: 26px; height: 26px; box-sizing: border-box;
  transform-origin: 0 0; transform: scale(var(--iz, 1)) translateY(-100%);
  border-radius: 50% 50% 50% 0; background: var(--accent); color: var(--on-accent);
  font: 600 11px/26px var(--font); text-align: center; cursor: pointer; pointer-events: auto;
  box-shadow: 0 0 0 2px var(--panel), 0 3px 8px rgba(0, 0, 0, .28); user-select: none; z-index: 2; touch-action: none;
}
.pb-pin:not(.done) { cursor: grab; }
.pb-pin.dragging { cursor: grabbing; z-index: 5; box-shadow: 0 0 0 2px var(--panel), 0 10px 22px rgba(0, 0, 0, .35); }
.pb-pin.working { background: var(--work); }
.pb-pin.done { background: var(--done-pin); }
.pb-pin.sel { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent), 0 3px 8px rgba(0, 0, 0, .28); z-index: 3; }
.pb-pin.draft { background: var(--panel); color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 3px 8px rgba(0, 0, 0, .25); animation: pb-pulse 1.4s ease-in-out infinite; }
.pb-region {
  position: absolute; border: 2px solid var(--accent); background: var(--accent-soft); border-radius: 3px;
  pointer-events: none; box-sizing: border-box;
}
.pb-region.done { border-color: var(--done-pin); background: transparent; border-style: dashed; }
.pb-region.draft { border-style: dashed; }
@keyframes pb-pulse { 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 7px var(--accent-soft), 0 3px 8px rgba(0, 0, 0, .25); } }
@media (prefers-reduced-motion: reduce) { .pb-pin.draft { animation: none; } }

/* ---------- sidebar ---------- */
#pb-side {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
}
.pb-rail { display: none; }
.pb-sum { display: none; }
.pb-toggle { flex: none; margin-left: -2px; }
.pb-toggle svg { transition: transform .2s; }
.pb-toggle.flip svg { transform: rotate(180deg); }
@media (min-width: 861px) {
  #pb-app.collapsed #pb-side > :not(.pb-rail) { display: none; }
  #pb-app.collapsed .pb-rail {
    display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; border: 0; background: none;
    width: 100%; height: 100%; cursor: pointer; color: var(--muted);
  }
  #pb-app.collapsed .pb-rail:hover { color: var(--ink); }
  .pb-rail .pb-mark { width: 16px; height: 16px; color: var(--ink); }
  .pb-rail-count {
    min-width: 22px; height: 22px; border-radius: 11px; padding: 0 6px; box-sizing: border-box; background: var(--accent); color: var(--on-accent);
    font: 600 11px/22px var(--font); text-align: center;
  }
  .pb-head .pb-toggle { order: 3; }
}
@media (max-width: 860px) {
  #pb-side { border-radius: var(--r); }
  .pb-head { cursor: pointer; padding: 8px 8px 8px 14px; }
  .pb-title { font-size: 15px; }
  .pb-sum { display: inline; font: 400 12px var(--font); color: var(--muted); margin-left: 2px; }
  .pb-list { max-height: 42vh; }
  #pb-app.collapsed .pb-list, #pb-app.collapsed .pb-handoff, #pb-app.collapsed .pb-head .pb-seg { display: none; }
  #pb-app.collapsed .pb-head { border-bottom: 0; }
  #pb-app.collapsed .pb-foot { border-top: 0; padding-top: 0; }
  #pb-app:not(.collapsed) .pb-sum { display: none; }
}
.pb-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.pb-title { font: 600 17px/1.2 var(--serif); letter-spacing: -.01em; flex: 1; display: flex; align-items: center; gap: 8px; }
.pb-title .pb-mark { width: 16px; height: 16px; color: var(--accent); }
.pb-seg .pb-count { font: 500 11px var(--mono); color: var(--faint); }
.pb-seg button[aria-pressed="true"] .pb-count { color: var(--accent); }
.pb-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px; min-height: 120px; }
.pb-empty { margin: auto; padding: 28px 22px; text-align: center; color: var(--muted); font-size: 13px; max-width: 30ch; text-wrap: balance; }
.pb-empty svg { width: 22px; height: 22px; color: var(--faint); display: block; margin: 0 auto 10px; }

.pb-item {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start;
  padding: 10px 8px 10px 10px; border-radius: 10px; cursor: pointer; position: relative;
}
.pb-item:hover { background: var(--line); }
.pb-item.sel { background: var(--accent-soft); }
.pb-badge {
  width: 22px; height: 22px; border-radius: 50% 50% 50% 0; background: var(--accent); color: var(--on-accent);
  font: 600 10.5px/22px var(--font); text-align: center; margin-top: 1px;
}
.pb-item.working .pb-badge { background: var(--work); }
.pb-item.done .pb-badge { background: var(--done-pin); }
.pb-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.pb-where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pb-who { width: 16px; height: 16px; border-radius: 50%; flex: none; font: 600 9px/16px var(--font); text-align: center; color: #fff; }
.pb-text { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.pb-item.done .pb-text { color: var(--muted); }
.pb-text[contenteditable="true"] { outline: 1px solid var(--line-strong); border-radius: 6px; padding: 2px 4px; margin-left: -4px; cursor: text; background: var(--panel); }
.pb-shots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.pb-shots img {
  width: 54px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: block; cursor: zoom-in; background: var(--stage);
}
.pb-reply {
  margin-top: 8px; padding: 7px 9px; border-radius: 8px; background: var(--line); font-size: 12.5px;
  display: flex; gap: 7px; align-items: flex-start;
}
.pb-reply svg { width: 13px; height: 13px; color: var(--accent); flex: none; margin-top: 2px; }
.pb-state { margin-top: 6px; font-size: 11.5px; color: var(--work); display: inline-flex; align-items: center; gap: 6px; }
.pb-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pb-blink 1.2s ease-in-out infinite; }
@keyframes pb-blink { 50% { opacity: .25; } }
.pb-acts { display: flex; gap: 0; opacity: 0; transition: opacity .12s; }
.pb-item:hover .pb-acts, .pb-item.sel .pb-acts, .pb-item:focus-within .pb-acts { opacity: 1; }
@media (hover: none) { .pb-acts { opacity: 1; } }
.pb-acts .pb-ibtn { width: 26px; height: 26px; }
.pb-acts .pb-ok:hover { color: var(--ok); background: var(--ok-soft); }
.pb-acts .pb-del.armed { color: #fff; background: #b4483a; }

.pb-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.pb-compose {
  border: 1px solid var(--line-strong); border-radius: 12px; background: var(--panel);
  padding: 5px 5px 5px 12px; display: flex; flex-direction: column; gap: 6px;
}
.pb-compose.drag { border-style: dashed; }
.pb-ctx { display: flex; align-items: center; gap: 6px; min-width: 0; height: 18px; margin-top: 3px; padding-right: 4px; font-size: 12px; color: var(--muted); }
.pb-ctx.general { color: var(--faint); }
.pb-ctx-ico { width: 12px; height: 12px; flex: none; display: grid; place-items: center; }
.pb-ctx-ico svg { width: 12px; height: 12px; }
.pb-ctx-text { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pb-ctx-x {
  margin-left: auto; flex: none; width: 18px; height: 18px; border: 0; padding: 0; border-radius: 6px; background: none;
  color: var(--faint); display: grid; place-items: center; cursor: pointer;
}
.pb-ctx-x:hover { color: var(--ink); background: var(--line); }
.pb-ctx-x svg { width: 11px; height: 11px; }
.pb-dshots { display: flex; gap: 8px; flex-wrap: wrap; }
.pb-dshot { position: relative; width: 52px; height: 52px; flex: none; }
.pb-dshot img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; border: 1px solid var(--line); display: block; cursor: zoom-in; background: var(--stage); }
.pb-dshot.pending img { opacity: .4; }
.pb-dshot button {
  position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 6px; border: 0; padding: 0;
  background: rgba(20, 20, 19, .72); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .12s;
}
.pb-dshot:hover button, .pb-dshot button:focus-visible { opacity: 1; }
@media (hover: none) { .pb-dshot button { opacity: 1; } }
.pb-dshot button svg { width: 10px; height: 10px; }
.pb-ta {
  flex: 1; min-width: 0; display: block; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
  font: inherit; font-size: 14px; line-height: 20px; height: 20px; min-height: 20px; max-height: 160px; padding: 5px 4px 5px 0; margin: 0; box-sizing: content-box;
}
.pb-ta::placeholder { color: var(--faint); }
.pb-crow { display: flex; align-items: flex-end; gap: 1px; }
.pb-crow .pb-ibtn { width: 30px; height: 30px; flex: none; }
.pb-send {
  flex: none; margin-left: 2px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s;
}
.pb-send:disabled { background: var(--line); color: var(--faint); cursor: default; }
.pb-send svg { width: 15px; height: 15px; }
.pb-handoff { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 0 2px; min-width: 0; }
.pb-handoff > span { white-space: nowrap; flex: none; }
.pb-handoff code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-handoff .pb-ibtn { flex: none; }
.pb-handoff code { font: 11px var(--mono); color: var(--ink); background: var(--line); padding: 2px 5px; border-radius: 5px; letter-spacing: -.01em; }
.pb-handoff .pb-ibtn { width: 24px; height: 24px; }
.pb-handoff .pb-ibtn svg { width: 13px; height: 13px; }
.pb-note { font-size: 11.5px; color: var(--faint); padding: 0 2px; }
.pb-copyall { padding: 3px 9px; font-size: 12px; }

/* ---------- overlays ---------- */
.pb-dropzone {
  position: absolute; inset: 10px; border: 2px dashed var(--accent); border-radius: 12px; background: var(--accent-soft);
  display: grid; place-items: center; color: var(--accent); font-weight: 600; z-index: 20; pointer-events: none;
}
.pb-lightbox { position: fixed; inset: 0; background: rgba(15, 14, 13, .82); display: grid; place-items: center; z-index: 100; cursor: zoom-out; padding: 24px; }
.pb-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.pb-toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 120; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px);
}
.pb-placeholder { margin: auto; text-align: center; color: var(--muted); padding: 32px; max-width: 36ch; }
.pb-placeholder b { display: block; font: 600 16px var(--serif); color: var(--ink); margin-bottom: 4px; }

/* ---------- image canvas ---------- */
.ic { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
.ic-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.ic-img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; box-shadow: var(--shadow); background: var(--panel); }
.ic-layer { position: absolute; inset: 0; pointer-events: none; }
.ic.comment { cursor: crosshair; }
.ic.browse { cursor: grab; }
.ic.panning { cursor: grabbing; }
.ic-zoom { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 2px; box-shadow: var(--shadow); z-index: 4; }
.ic-zoom .pb-ibtn { width: 28px; height: 28px; }
.ic-zoom output { font: 11px var(--mono); color: var(--muted); min-width: 42px; text-align: center; cursor: pointer; }

/* ---------- timeline ---------- */
.tl { position: relative; height: 74px; touch-action: none; cursor: pointer; user-select: none; }
.tl canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tl-tip {
  position: absolute; top: -26px; transform: translateX(-50%); font: 11px var(--mono); background: var(--ink); color: var(--panel);
  padding: 3px 6px; border-radius: 6px; pointer-events: none; white-space: nowrap;
}

/* ---------- comment button ---------- */
.pb-fab {
  position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 15;
  display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px 0 14px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); font: 500 14px var(--font); cursor: pointer;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .16), 0 1px 3px rgba(0, 0, 0, .1); white-space: nowrap; transition: background .15s, color .15s;
  -webkit-tap-highlight-color: transparent;
}
.pb-fab:hover { border-color: var(--ink); }
.pb-fab[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.pb-fab-ico { width: 18px; height: 18px; display: grid; place-items: center; }
.pb-fab-ico svg { width: 18px; height: 18px; }

/* ---------- patches below the work (audio, video) ---------- */
#pb-app.below { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: start; }
#pb-app.below .pb-stage { height: var(--stage-h, 66vh); min-height: 300px; }
#pb-app.below #pb-side > .pb-rail, #pb-app.below .pb-toggle { display: none !important; }
#pb-app.below #pb-side { border: 0; background: transparent; overflow: visible; }
#pb-app.below .pb-foot { order: -1; border-top: 0; padding: 0 0 4px; }
#pb-app.below .pb-head { border-bottom: 0; padding: 10px 2px 4px; cursor: default; }
#pb-app.below .pb-list { max-height: none; overflow: visible; padding: 0; min-height: 0; }
#pb-app.below .pb-list, #pb-app.below .pb-handoff, #pb-app.below .pb-head .pb-seg { display: flex !important; }
#pb-app.below .pb-sum { display: none !important; }
#pb-app.below .pb-empty { padding: 18px; }
@media (max-width: 860px) { #pb-app.below .pb-stage { height: var(--stage-h-m, 56vh); } }

.pb-scope { align-self: flex-start; margin: 6px 10px 4px; border: 0; background: none; padding: 4px 0; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.pb-scope:hover { color: var(--ink); }
.pb-empty + .pb-scope { align-self: center; margin-top: -8px; }

.pb-mic.on { color: var(--on-accent); background: var(--accent); animation: pb-rec 1.2s ease-in-out infinite; }
@keyframes pb-rec { 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
@media (prefers-reduced-motion: reduce) { .pb-mic.on { animation: none; } }
/* interface surface */
.if-area { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.if-frame { position: absolute; transform-origin: 0 0; background: #fff; box-sizing: content-box; }
.if-frame.fixed { border-radius: 8px; overflow: hidden; box-shadow: var(--shadow), 0 0 0 1px var(--line); }

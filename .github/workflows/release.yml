name: Release skills

# Builds one zip per skill plus patchbook-skills.zip and publishes them as a GitHub release.
# Runs when the version in .claude-plugin/plugin.json changes, and by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Build zips
        run: |
          mkdir -p dist
          cd skills
          for s in */; do s="${s%/}"; zip -qr "../dist/$s.zip" "$s"; done
          cd ..
          mkdir -p bundle/patchbook-skills
          cp -r skills/* README.md LICENSE bundle/patchbook-skills/
          (cd bundle && zip -qr ../dist/patchbook-skills.zip patchbook-skills)
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills-v${{ steps.v.outputs.version }}
          name: Patchbook Skills ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Review skills for Claude. Every website, app, image, PDF, audio file or video Claude builds gets a review page where you pin comments on the exact spot, attach screenshots, and let Claude work through the patches.

            ### What's inside
            | Skill | Reviews |
            | --- | --- |
            | `website-review` | Live websites at any breakpoint |
            | `app-review` | Live apps in a device frame, or native screens |
            | `image-review` | Images, posters, logos and variants |
            | `pdf-review` | PDFs, page by page |
            | `audio-review` | Songs, mixes, jingles, voiceovers |
            | `video-review` | Video cuts with a scene bar |

            ### Downloads
            - **`patchbook-skills.zip`**: all six skills, plus README and license
            - **`<name>-review.zip`**: one skill, ready to upload

            ### Install
            - **Claude (web, desktop, mobile):** Customize → Skills → **+** → Create skill → Upload a skill, then pick a single skill zip.
            - **Claude Code:** `/plugin marketplace add justsecretzone/Patchbook`, then `/plugin install patchbook@patchbook`.
            - **ChatGPT (Business, Enterprise, Edu):** Plugins → Skills → Create → Upload from your computer. Patches stay in the browser there; use **Copy patches** to hand them back.

            Full guide in the [README](https://github.com/justsecretzone/Patchbook#install). What changed: [CHANGELOG](https://github.com/justsecretzone/Patchbook/blob/main/CHANGELOG.md).
          files: dist/*.zip
